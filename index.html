<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LYN Store</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Pequeño ajuste para que los enlaces de la barra se vean en línea */
        .navbar nav ul { display: flex; list-style: none; margin: 0; padding: 0; }
        .navbar nav ul li { margin-left: 15px; }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo">LYN Store</div>
        <nav>
            <ul>
                <li><a href="#" onclick="mostrarVista('comprador')">Tienda</a></li>
                <li><a href="#" onclick="mostrarVista('vendedor')">Agregar producto</a></li>
            </ul>
        </nav>
        <div class="cart-summary">
            Total Carrito: <span id="total-display">S/ 0.00</span>
        </div>
    </header>

    <main class="container">
        <h1 id="titulo-pagina" style="text-align: center; margin-top: 20px;">Bienvenido a la Tienda</h1>
        
        <div id="admin-form-container" class="form-container" style="display: none; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <h2>Nuevo Producto</h2>
            <input id="nombre" placeholder="Nombre"><br>
            <input id="precio" type="number" placeholder="Precio"><br>
            <input type="file" id="fileInput"><br>
            <button class="btn-guardar" onclick="subirProducto()">Guardar Producto</button>
        </div>

        <div id="productos-grid" class="grid"></div>
    </main>

    <div id="login-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); justify-content:center; align-items:center; z-index:1000;">
        <div style="background:white; padding:30px; border-radius:12px; width:300px; text-align:center; box-shadow:0 4px 15px rgba(0,0,0,0.3);">
            <h2 style="margin-top:0;">Iniciar Sesión</h2>
            <input type="text" id="login-user" placeholder="Usuario" style="width:90%; padding:8px; margin-bottom:10px;"><br>
            <input type="password" id="login-pass" placeholder="Contraseña" style="width:90%; padding:8px; margin-bottom:20px;"><br>
            <button onclick="verificarLogin()" style="padding:10px 20px; cursor:pointer;">Entrar</button>
            <button onclick="cerrarModal()" style="padding:10px 20px; cursor:pointer;">Cancelar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
